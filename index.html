<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIONRACK 产品目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        html {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5f7fa;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .title {
            text-align: center;
            font-size: 26px;
            margin-bottom: 20px;
            color: #222;
        }
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 5px #00000010;
            text-align: center;
            transition: 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        .nav button.active {
            background: #409eff;
            color: white;
        }
        .nav button:hover{
            opacity: 0.9;
        }
        .page {
            display: none;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000a;
        }
        .page.active {
            display: block;
        }
        .item {
            display: block;
            padding: 18px 22px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            border-left: 4px solid #409eff;
            transition: 0.2s;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .item:hover {
            background: #eef5ff;
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <h2 class="title">📚 ORIONRACK 产品目录</h2>
    <div class="nav">
        <button class="active">English-中文 catalog</button>
        <button>Русский язык-English catalog</button>
        <button>Vedio</button>
    </div>

    <div class="page active">
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/uwqd/" target="_blank">📖 Racking system 仓储货架</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/vjbd/" target="_blank">📖 Storage equipment 仓储设备</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/fafe/" target="_blank">📖 Product introduction 产品简介</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/limj/" target="_blank">📖 Radio-shuttle Rack 穿梭式货架</a>
    </div>

    <div class="page">
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/aylk/" target="_blank">📖 Складские стеллажи Racking System</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/avbj/" target="_blank">📖 Складское оборудование Storage Equipment</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/zsxj/" target="_blank">📖 Обзор продукта Product introduction</a>
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/oipy/" target="_blank">📖 Шаттловые стеллажи Radio shuttle Rack</a>
    </div>

    <div class="page">
        <a class="item" href="https://online.fliphtml5.com/ORIONRACK/fafe/" target="_blank">📖 打开产品手册</a>
    </div>

    <script>
        let pages = document.querySelectorAll('.page');
        let btns = document.querySelectorAll('.nav button');
        let items = document.querySelectorAll('.item');

        function bindTap(el, callback) {
            let isTouch = false;
            el.addEventListener('touchstart', () => { isTouch = true; });
            el.addEventListener('touchend', (e) => {
                isTouch = false;
                e.preventDefault();
                callback();
            });
            el.addEventListener('click', (e) => {
                if (!isTouch) {
                    e.preventDefault();
                    callback();
                }
            });
        }

        function openPage(index) {
            pages.forEach((p, i) => {
                p.classList.toggle('active', i === index);
            });
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            setTimeout(() => {
                pages.forEach((p, i) => {
                    if (i !== index) p.style.display = 'none';
                });
            }, 320);
        }

        btns.forEach((btn, i) => {
            bindTap(btn, () => openPage(i));
        });

        items.forEach(item => {
            bindTap(item, () => {
                const href = item.getAttribute('href');
                if (href) window.open(href, '_blank');
            });
        });

        openPage(0);
    </script>
</body>
</html>
